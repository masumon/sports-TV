<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ABO Sports TV">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
    <linearGradient id="gold512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
    <linearGradient id="whitefade512" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg512)"/>
  <!-- Subtle top-shine -->
  <rect width="512" height="256" rx="100" fill="url(#whitefade512)"/>
  <!-- Gold border glow -->
  <rect x="3" y="3" width="506" height="506" rx="98" fill="none" stroke="#F5A623" stroke-width="4" stroke-opacity="0.3"/>

  <!-- White app-icon container -->
  <rect x="68" y="68" width="376" height="376" rx="72" fill="white"/>
  <!-- Gold inner border -->
  <rect x="68" y="68" width="376" height="376" rx="72" fill="none" stroke="#F5A623" stroke-width="4" stroke-opacity="0.45"/>

  <!-- ABO text — large, dark -->
  <text x="256" y="236" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="104" fill="#0a0d18" letter-spacing="8">ABO</text>

  <!-- SPORTS TV — gold, smaller -->
  <text x="256" y="326" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="40" fill="#C9A227" letter-spacing="10">SPORTS TV</text>

  <!-- Red LIVE dot top-right -->
  <circle cx="414" cy="98" r="28" fill="#ef4444"/>
  <circle cx="414" cy="98" r="14" fill="white"/>
</svg>

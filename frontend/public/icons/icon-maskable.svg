<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ABO Sports TV">
  <defs>
    <linearGradient id="bgm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111320"/>
      <stop offset="100%" stop-color="#06070e"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (maskable safe zone = center 80%) -->
  <rect width="512" height="512" fill="url(#bgm)"/>

  <!-- White icon container — within safe zone -->
  <rect x="106" y="106" width="300" height="300" rx="56" fill="white"/>
  <rect x="106" y="106" width="300" height="300" rx="56" fill="none" stroke="#F5A623" stroke-width="3" stroke-opacity="0.5"/>

  <!-- ABO text -->
  <text x="256" y="234" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="84" fill="#0a0d18" letter-spacing="6">ABO</text>

  <!-- SPORTS TV -->
  <text x="256" y="310" text-anchor="middle" dominant-baseline="middle"
        font-family="Arial Black, Impact, sans-serif" font-weight="900"
        font-size="32" fill="#C9A227" letter-spacing="8">SPORTS TV</text>
</svg>

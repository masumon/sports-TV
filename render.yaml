# Render Blueprint — Web Service for the FastAPI backend (monorepo root: this file lives next to backend/)
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy: set CORS_ORIGINS to your Vercel URL(s), comma-separated, no trailing slashes.
# Include preview URLs too if the frontend calls the API with an absolute origin (e.g. direct Render URL
# in NEXT_PUBLIC_API_BASE_URL). When the app uses same-origin /api (recommended), CORS is not needed
# for viewer traffic, but admin/auth from another origin still needs a matching entry here.

services:
  - type: web
    name: gstv-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SCRAPER_SOURCE_URL
        value: https://iptv-org.github.io/iptv/categories/sports.m3u
      # Empty DB still gets one startup sync in app/main.py — no need to force true here (saves free-tier CPU).
      - key: AUTO_SYNC_CHANNELS_ON_STARTUP
        value: "false"
      # Optional: Redis Cloud / Upstash — channel list cache (omit in dashboard if unused)
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: SYNC_RATE_LIMIT_SECONDS
        value: "60"
      # APScheduler: >0 enables background jobs. Use one Render web service only (duplicate workers = duplicate jobs).
      # 120 = every 2h — gentler on free-tier CPU/RAM than 15–30m. Set 0 to disable; use admin sync or POST /internal/sync.
      - key: SCHEDULED_SYNC_INTERVAL_MINUTES
        value: "120"
      # Keep 0 on free tier (extra upstream + DB load); enable on paid hosts if you want auto source discovery.
      - key: SOURCE_DISCOVERY_INTERVAL_HOURS
        value: "0"
      # Playwright Chromium — high RAM on small instances; keep 0 unless you rely on DynamicStream token refresh.
      - key: M3U8_REFRESH_INTERVAL_MINUTES
        value: "0"
      # Deactivate dead stream URLs on a sample; 120m aligns with sync cadence. Set 0 to disable checks only.
      - key: STREAM_VALIDATION_INTERVAL_MINUTES
        value: "120"
      # Real match schedule → live_fixtures table (GET /sports-tv/fixtures). 0=off. 60=every 1h.
      - key: LIVE_FIXTURES_SYNC_INTERVAL_MINUTES
        value: "60"
      - key: LIVE_FIXTURES_DAYS_AHEAD
        value: "14"
      # bl1=Bundesliga1, bl2=Bundesliga2, ucl=UEFA CL, dfb=DFB Pokal
      # football-data.org also syncs if FOOTBALL_DATA_ORG_API_TOKEN is set (free tier = PL,CL,BL1,SA,PD,FL1,EL)
      - key: OPENLIGADB_LEAGUE_KEYS
        value: "bl1,bl2,ucl,dfb"
      - key: FOOTBALL_DATA_ORG_API_TOKEN
        sync: false
      # Neon free tier: small pool (raise only if you scale workers)
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SYNC_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@test.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      # true = each deploy keeps only ADMIN_EMAIL; other users are deleted. Set false if you need persistent signups.
      - key: PRUNE_NON_DEFAULT_USERS_ON_STARTUP
        value: "true"
      # No trailing slash. Preview *.vercel.app is also allowed via allow_origin_regex in main.py.
      - key: CORS_ORIGINS
        value: "https://sports-tv-lovat.vercel.app,http://localhost:3000"

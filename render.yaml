# Render Blueprint — Web Service for the FastAPI backend (monorepo root: this file lives next to backend/)
# Docs: https://render.com/docs/blueprint-spec
#
# Auto-deploy: connect this repo in Render Dashboard → Blueprints (or service Settings → Git).
# Every push/merge to `main` triggers a production deploy when autoDeployTrigger is `commit`.
#
# After deploy: set CORS_ORIGINS to your Vercel URL(s), comma-separated, no trailing slashes.
# Include preview URLs too if the frontend calls the API with an absolute origin (e.g. direct Render URL
# in NEXT_PUBLIC_API_BASE_URL). When the app uses same-origin /api (recommended), CORS is not needed
# for viewer traffic, but admin/auth from another origin still needs a matching entry here.

previews:
  generation: automatic

services:
  - type: web
    name: gstv-backend
    runtime: python
    repo: https://github.com/masumon/sports-TV
    branch: main
    autoDeployTrigger: commit
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: SCRAPER_SOURCE_URL
        value: https://iptv-org.github.io/iptv/categories/sports.m3u
      # Background startup task in app/main.py runs sync asynchronously after port bind — safe to enable.
      - key: AUTO_SYNC_CHANNELS_ON_STARTUP
        value: "true"
      # Optional: Redis Cloud / Upstash — channel list cache (omit in dashboard if unused)
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: SYNC_RATE_LIMIT_SECONDS
        value: "60"
      # APScheduler: >0 enables background jobs. Use one Render web service only (duplicate workers = duplicate jobs).
      # 240 = every 4h — gentler on free-tier CPU/RAM. Set 0 to disable; use admin sync or POST /internal/sync.
      - key: SCHEDULED_SYNC_INTERVAL_MINUTES
        value: "240"
      # Keep 0 on free tier (extra upstream + DB load); enable on paid hosts if you want auto source discovery.
      - key: SOURCE_DISCOVERY_INTERVAL_HOURS
        value: "0"
      # Playwright Chromium — high RAM on small instances; keep 0 unless you rely on DynamicStream token refresh.
      # Licensed production IPTV: set 10 (poll every 10m; refreshes tokens within lead window).
      - key: M3U8_REFRESH_INTERVAL_MINUTES
        value: "0"
      - key: M3U8_TOKEN_REFRESH_LEAD_MINUTES
        value: "15"
      # Comma-separated hostnames for POST /api/v1/proxy/license (your DRM servers only).
      - key: DRM_LICENSE_ALLOWLIST_HOSTS
        sync: false
      # Deactivate dead stream URLs on a sample; 240m aligns with sync cadence. Set 0 to disable checks only.
      - key: STREAM_VALIDATION_INTERVAL_MINUTES
        value: "240"
      # Real match schedule → live_fixtures table (GET /sports-tv/fixtures). 0=off. 15=every 15min (WC 2026 active).
      - key: LIVE_FIXTURES_SYNC_INTERVAL_MINUTES
        value: "15"
      - key: LIVE_FIXTURES_DAYS_AHEAD
        value: "14"
      - key: LIVE_FIXTURES_HOURS_BACK
        value: "120"
      - key: CRICAPI_MAX_PAGES
        value: "2"
      # bl1=Bundesliga1, bl2=Bundesliga2, ucl=UEFA CL, dfb=DFB Pokal
      # football-data.org also syncs if FOOTBALL_DATA_ORG_API_TOKEN is set (free tier = PL,CL,BL1,SA,PD,FL1,EL)
      # ucl is NOT valid on OpenLigaDB — use FOOTBALL_DATA_ORG_API_TOKEN for CL/EL/WC
      - key: OPENLIGADB_LEAGUE_KEYS
        value: "bl1,bl2,dfb"
      - key: FOOTBALL_DATA_ORG_API_TOKEN
        sync: false
      # CricAPI free tier (100 calls/day) — https://cricapi.com/register
      - key: CRICAPI_KEY
        sync: false
      # PL=Premier League, CL=Champions League, EL=Europa League, BL1=Bundesliga,
      # PD=La Liga, SA=Serie A, FL1=Ligue 1, EC=Euro Championship, WC=World Cup
      - key: FOOTBALL_DATA_COMPETITIONS
        value: "PL,CL,EL,BL1,PD,SA,FL1,EC,WC"
      # Neon free tier: keep pool small (1 Render worker + PgBouncer)
      - key: DB_POOL_SIZE
        value: "2"
      - key: DB_MAX_OVERFLOW
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_SYNC_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      # true = each deploy keeps only ADMIN_EMAIL; other users are deleted. Set false if you need persistent signups.
      - key: PRUNE_NON_DEFAULT_USERS_ON_STARTUP
        value: "true"
      # No trailing slash. Preview *.vercel.app is also allowed via allow_origin_regex in main.py.
      - key: CORS_ORIGINS
        value: "https://sports-tv-lovat.vercel.app,http://localhost:3000"
      # ── Indian Proxy (Star Sports / Sony Sports geo-unlock) ──────────────────
      # Star Sports, Sony Sports and similar India-region-locked channels require
      # requests to originate from an Indian IP. The Render backend runs in the US,
      # so without a proxy these channels return geo-block 403s regardless of header spoofing.
      #
      # Set this in the Render Dashboard → gstv-backend → Environment → Add Secret:
      #   Key:   STREAM_UPSTREAM_HTTP_PROXY
      #   Value: http://USERNAME:PASSWORD@PROXY_HOST:PORT
      #
      # Recommended providers (Indian IPs):
      #   • Webshare  — https://proxy.webshare.io  (easiest, $2.99+/mo for Indian IPs)
      #   • IPRoyal   — https://iproyal.com         (residential, pay-as-you-go)
      #   • Proxy6    — https://proxy6.net           (datacenter, cheap)
      #
      # Leave UNSET (sync:false) to keep using X-Forwarded-For header spoofing only.
      # Set to empty string "" to disable the proxy without removing the variable.
      - key: STREAM_UPSTREAM_HTTP_PROXY
        sync: false
      # Geo bypass headers (X-Forwarded-For / X-Real-IP with Indian ISP IPs) — keep true always.
      - key: STREAM_GEO_BYPASS_ENABLED
        value: "true"
